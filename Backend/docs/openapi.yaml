        - { name: id, in: path, required: true, schema: { type: string, example: LP-2026-101 } }
      responses:
        '200':
          description: Cancelled request
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /ot-requests:
    post:
      tags: [overtime]
      summary: Submit overtime request
      description: >
        Hours are computed from the times (max 4 h a day). 409 OT_OVERLAP for an overlapping request that day and 409 OT_MONTHLY_LIMIT above 40 h a month (legal limit). An approved request of a past day cannot be cancelled. Chain: employee -> LINE_MANAGER of the same department -> HR_DIRECTOR. Requests of a LINE_MANAGER or HR_DIRECTOR are approved only by the CEO, a CEO request is approved automatically, the CEO may approve any pending step directly, and nobody acts on their own request.
