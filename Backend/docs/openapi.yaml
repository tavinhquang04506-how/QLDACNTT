openapi: 3.0.3
info:
  title: NEXUS HRMS Backend API
  version: 1.4.0
  description: >
    REST API for the NEXUS HRMS frontend. Success bodies are `{ success: true, data, pagination? }`
    (some legacy endpoints add extra top-level fields). Error bodies are
    `{ success: false, code, message, details? }`. Messages are Vietnamese.
    Send `Authorization: Bearer <accessToken>` on every endpoint except login, refresh, logout and health.
    Access tokens are short-lived; use POST /auth/refresh with the refresh token to get a new pair.
    Every request re-checks the account in the database, so deactivation, offboarding and role changes apply
    immediately (401 `ACCOUNT_DISABLED` / 403). KIOSK accounts can only call POST /attendance/kiosk/punch,
    GET /auth/me and POST /auth/change-password.
    DATE fields are `YYYY-MM-DD` strings; timestamps are ISO 8601 (UTC). The company time zone is Asia/Ho_Chi_Minh.
servers:
  - url: http://localhost:8000/api
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: users
  - name: employees
  - name: contracts
  - name: attendance
  - name: leaves
  - name: overtime
  - name: medical
  - name: payroll
  - name: projects
  - name: tasks
  - name: squads
  - name: notifications
  - name: notices
  - name: handbook
  - name: analytics
  - name: dashboard
  - name: departments
  - name: positions
  - name: audit
paths:
  /health:
    get:
      tags: [auth]
      summary: Health check (no auth)
      security: []
      responses:
        '200':
          description: Server and database are up
  /auth/login:
    post:
      tags: [auth]
      summary: Log in with email and password
      description: Returns the legacy `token` (same value as `accessToken`) plus a refresh token. Locked after 5 failed attempts for 15 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  token: { type: string, description: Legacy alias of accessToken }
                  accessToken: { type: string }
                  refreshToken: { type: string }
                  expiresIn: { type: integer, description: Access token lifetime in seconds }
                  mustChangePassword: { type: boolean }
                  user: { $ref: '#/components/schemas/SessionUser' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403':
          description: Account disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '423':
          description: Account locked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      tags: [auth]
      summary: Exchange a refresh token for a new access + refresh pair
      description: >
        The refresh token is single-use (rotation). Presenting an already-used token revokes the whole
        session chain and returns 401 `REFRESH_TOKEN_REUSED`; the user must log in again.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  token: { type: string }
                  accessToken: { type: string }
                  refreshToken: { type: string }
                  expiresIn: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401':
          description: INVALID_REFRESH_TOKEN, REFRESH_TOKEN_REUSED or ACCOUNT_DISABLED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke a refresh token (idempotent)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Logged out
        '400': { $ref: '#/components/responses/Error' }
  /auth/me:
    get:
      tags: [auth]
      summary: Profile of the current user
      responses:
        '200':
          description: Current user
        '401': { $ref: '#/components/responses/Error' }
  /auth/change-password:
    post:
      tags: [auth]
      summary: Change own password
      description: New password needs at least 8 characters with a letter and a digit. Clears `mustChangePassword` and revokes all refresh tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        '200':
          description: Password changed
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /users:
    get:
      tags: [users]
      summary: List accounts
      description: Roles CEO, HR_DIRECTOR, ADMIN.
      parameters:
        - { name: search, in: query, schema: { type: string }, description: Matches email, full name or employee id }
        - { name: role, in: query, schema: { $ref: '#/components/schemas/Role' } }
        - { name: active, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/limit' }
      responses:
        '200':
          description: Page of accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [users]
      summary: Create an account
      description: >
        CEO may assign any role; HR_DIRECTOR and ADMIN only EMPLOYEE, LINE_MANAGER, KIOSK.
        Without `password` a temporary password is generated and returned once as `temporaryPassword`.
        The account must change its password at first login. `employeeId` is optional only for KIOSK and ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                employeeId: { type: string }
                email: { type: string }
                role: { $ref: '#/components/schemas/Role' }
                password: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/User' }
                  temporaryPassword: { type: string, description: Shown once, only when no password was supplied }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /users/{id}:
    get:
      tags: [users]
      summary: Get one account
      parameters:
        - { $ref: '#/components/parameters/userId' }
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [users]
      summary: Change role or active flag
      description: >
        Nobody can change their own role or deactivate themselves. Any activation change revokes all refresh tokens.
        HR_DIRECTOR cannot manage CEO/ADMIN accounts; ADMIN can only manage EMPLOYEE, LINE_MANAGER and KIOSK accounts.
      parameters:
        - { $ref: '#/components/parameters/userId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: '#/components/schemas/Role' }
                isActive: { type: boolean }
      responses:
        '200':
          description: Updated account
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /users/{id}/reset-password:
    post:
      tags: [users]
      summary: Set a temporary password
      description: Unlocks the account, forces a password change at next login and revokes all sessions. The temporary password is returned once.
      parameters:
        - { $ref: '#/components/parameters/userId' }
      responses:
        '200':
          description: Temporary password issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  temporaryPassword: { type: string }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /users/{id}/unlock:
    post:
      tags: [users]
      summary: Clear the lockout and failed-attempt counter
      parameters:
        - { $ref: '#/components/parameters/userId' }
      responses:
        '200':
          description: Updated account
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /employees:
    get:
      tags: [employees]
      summary: List employees
      description: >
        LINE_MANAGER sees only their own department (or only themselves without one). Sensitive fields
        (base_salary, citizen_id, bank_account, bank_name, date_of_birth, address, termination_reason) are removed
        unless the caller is the record owner, HR_DIRECTOR or CEO. face_encoding is never returned.
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: department, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/EmployeeStatus' } }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/limit' }
      responses:
        '200':
          description: Page of employees (snake_case rows)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Employee' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
    post:
      tags: [employees]
      summary: Create an employee (onboarding)
      description: Roles CEO, HR_DIRECTOR. Creates the initial active contract from contractType, baseSalary and joinedDate. `id` is generated (`NV-<n>`) when omitted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeInput' }
      responses:
        '201':
          description: Created
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /employees/import:
    post:
      tags: [employees]
      summary: Bulk import employees
      description: >
        Roles CEO, HR_DIRECTOR. 1 to 500 rows, each shaped like the create body. Every row runs in its own savepoint:
        bad rows are reported in `failed` (1-based `row`) and the good ones are kept. With `dryRun` nothing is written.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                rows:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: '#/components/schemas/EmployeeInput' }
                dryRun: { type: boolean }
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  dryRun: { type: boolean }
                  created: { type: integer }
                  createdIds:
                    type: array
                    items: { type: string }
                  failed:
                    type: array
                    items:
                      type: object
                      properties:
                        row: { type: integer }
                        code: { type: string }
                        message: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /employees/{id}:
    get:
      tags: [employees]
      summary: Employee detail (Profile 360)
      description: EMPLOYEE may open only their own record; LINE_MANAGER only their department; others all.
      parameters:
        - { $ref: '#/components/parameters/empId' }
      responses:
        '200':
          description: Employee
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [employees]
      summary: Update an employee
      description: "Partial update; `null` clears a nullable field. `status: DA_NGHI_VIEC` is refused (use offboard) and a terminated employee cannot change status."
      parameters:
        - { $ref: '#/components/parameters/empId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeInput' }
      responses:
        '200':
          description: Updated
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /employees/{id}/offboard:
    post:
      tags: [employees]
      summary: End an employment
      description: >
        Roles CEO, HR_DIRECTOR. Sets status DA_NGHI_VIEC with termination date and reason, disables the login,
        revokes all refresh tokens, terminates the active contract and clears the department head role.
        `directReports` is the number of active employees still reporting to this person.
      parameters:
        - { $ref: '#/components/parameters/empId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [terminationDate, reason]
              properties:
                terminationDate: { type: string, format: date }
                reason: { type: string }
                note: { type: string }
      responses:
        '200':
          description: Employee terminated
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /employees/{id}/contracts:
    get:
      tags: [contracts]
      summary: Contracts of an employee, newest first
      description: HR_DIRECTOR and CEO for anyone; an EMPLOYEE only for themselves.
      parameters:
        - { $ref: '#/components/parameters/empId' }
      responses:
        '200':
          description: Contracts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Contract' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [contracts]
      summary: Create a contract
      description: >
        Roles CEO, HR_DIRECTOR. With status HIEU_LUC (default) the employee's active contract ends the day before
        this one starts (409 CONTRACT_OVERLAP if this one does not start later) and the employee's base_salary and
        contract_type are synced. CHO_KY creates a draft that changes nothing until activated.
      parameters:
        - { $ref: '#/components/parameters/empId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, startDate, salary]
              properties:
                contractNo: { type: string, description: Generated when omitted }
                type: { $ref: '#/components/schemas/ContractType' }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date, nullable: true }
                salary: { type: number, minimum: 0 }
                status: { type: string, enum: [HIEU_LUC, CHO_KY] }
                fileUrl: { type: string, nullable: true }
                signedAt: { type: string, format: date-time, nullable: true }
                note: { type: string, nullable: true }
      responses:
        '201':
          description: Created
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /contracts/{id}:
    get:
      tags: [contracts]
      summary: Get one contract
      parameters:
        - { $ref: '#/components/parameters/contractId' }
      responses:
        '200':
          description: Contract
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [contracts]
      summary: Edit a draft or active contract
      description: Editable fields are salary, endDate, fileUrl, signedAt, note. Ended contracts return 409. A salary edit on the active contract syncs the employee.
      parameters:
        - { $ref: '#/components/parameters/contractId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                salary: { type: number, minimum: 0 }
                endDate: { type: string, format: date, nullable: true }
                fileUrl: { type: string, nullable: true }
                signedAt: { type: string, format: date-time, nullable: true }
                note: { type: string, nullable: true }
      responses:
        '200':
          description: Updated
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /contracts/{id}/activate:
    post:
      tags: [contracts]
      summary: Activate a draft (CHO_KY) contract
      parameters:
        - { $ref: '#/components/parameters/contractId' }
      responses:
        '200':
          description: Activated
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /contracts/{id}/terminate:
    post:
      tags: [contracts]
      summary: Terminate a contract
      description: The end date defaults to today and cannot precede the start date.
      parameters:
        - { $ref: '#/components/parameters/contractId' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                terminationDate: { type: string, format: date }
                note: { type: string }
      responses:
        '200':
          description: Terminated
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /departments:
    get:
      tags: [departments]
      summary: List active departments with head count
      description: "`budget_yearly` is included only for CEO and HR_DIRECTOR."
      responses:
        '200':
          description: Departments
    post:
      tags: [departments]
      summary: Create a department
      description: Roles CEO, HR_DIRECTOR. The id is `DEPT-<code>`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string, description: 2-15 letters or digits, stored upper-case }
                name: { type: string }
                description: "{ type: string, nullable: true }"
                budgetYearly: { type: number, minimum: 0 }
                managerId: { type: string, nullable: true }
      responses:
        '201':
          description: Created
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /departments/{id}:
    get:
      tags: [departments]
      summary: Get one department
      description: "`budget_yearly` is included only for CEO and HR_DIRECTOR."
      parameters:
        - { $ref: '#/components/parameters/deptId' }
      responses:
        '200':
          description: Department
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [departments]
      summary: Update a department
      parameters:
        - { $ref: '#/components/parameters/deptId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: "{ type: string, nullable: true }"
                budgetYearly: { type: number, minimum: 0 }
                managerId: { type: string, nullable: true }
                isActive: { type: boolean }
      responses:
        '200':
          description: Updated
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [departments]
      summary: Deactivate a department
      description: Refused with 409 `DEPARTMENT_HAS_EMPLOYEES` while non-terminated employees remain. Idempotent.
      parameters:
        - { $ref: '#/components/parameters/deptId' }
      responses:
        '200':
          description: Deactivated
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /departments/{id}/employees:
    get:
      tags: [departments]
      summary: Active employees of a department
      parameters:
        - { $ref: '#/components/parameters/deptId' }
      responses:
        '200':
          description: Employees
  /positions:
    get:
      tags: [positions]
      summary: List positions (job titles)
      parameters:
        - { name: includeInactive, in: query, schema: { type: string, enum: ['true', 'false'] } }
      responses:
        '200':
          description: Positions ordered by level then name
    post:
      tags: [positions]
      summary: Create a position
      description: Roles CEO, HR_DIRECTOR. The id is `POS-<code>`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string }
                name: { type: string }
                level: { type: integer, minimum: 0, maximum: 10 }
                description: "{ type: string, nullable: true }"
      responses:
        '201':
          description: Created
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /positions/{id}:
    get:
      tags: [positions]
      summary: Get one position
      parameters:
        - { $ref: '#/components/parameters/posId' }
      responses:
        '200':
          description: Position
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [positions]
      summary: Update a position
      parameters:
        - { $ref: '#/components/parameters/posId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                level: { type: integer, minimum: 0, maximum: 10 }
                description: "{ type: string, nullable: true }"
                isActive: { type: boolean }
      responses:
        '200':
          description: Updated
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [positions]
      summary: Deactivate a position
      description: Refused with 409 `POSITION_IN_USE` while non-terminated employees hold it.
      parameters:
        - { $ref: '#/components/parameters/posId' }
      responses:
        '200':
          description: Deactivated
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /attendance:
    get:
      tags: [attendance]
      summary: Attendance history (paged)
      description: >
        EMPLOYEE sees only their own rows, LINE_MANAGER their department, HR/CEO everyone. A KIOSK account cannot read.
      parameters:
        - { name: date, in: query, schema: { type: string } }
        - { name: month, in: query, schema: { type: string } }
        - { name: department, in: query, schema: { type: string } }
        - { name: employeeId, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/limit' }
      responses:
        '200':
          description: Page of attendance rows
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /attendance/check-in:
    post:
      tags: [attendance]
      summary: Check in for today (company time zone)
      description: >
        Method is one of gps, manual, qr, kiosk (face_id is no longer accepted). The DB trigger computes late minutes against 08:00 Vietnam time. 409 when already checked in; 403 when the account has no employee record.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                method: { type: string, enum: [gps, manual, qr, kiosk] }
                gpsLat: { type: number, minimum: -90, maximum: 90 }
                gpsLng: { type: number, minimum: -180, maximum: 180 }
      responses:
        '201':
          description: Checked in
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /attendance/check-out:
    post:
      tags: [attendance]
      summary: Check out for today
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                method: { type: string, enum: [gps, manual, qr, kiosk] }
      responses:
        '200':
          description: Checked out (work_hours and ot_hours computed)
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /attendance/me/today:
    get:
      tags: [attendance]
      summary: Today's punch state of the caller
      responses:
        '200':
          description: row (or null), checkedIn, checkedOut
        '403': { $ref: '#/components/responses/Error' }
  /attendance/qr:
    get:
      tags: [attendance]
      summary: The caller's attendance QR token
      description: >
        Short-lived (60 s) and single-use. Render it as a QR code; a kiosk scans it and posts it to /attendance/kiosk/punch. It is signed with a key derived from the JWT secret and cannot be used as an access token.
      responses:
        '200':
          description: "{ qrToken, expiresIn, employeeId }"
        '403': { $ref: '#/components/responses/Error' }
  /attendance/kiosk/punch:
    post:
      tags: [attendance]
      summary: Kiosk scans an employee QR
      description: >
        Roles KIOSK, HR_DIRECTOR, CEO. The first scan of the day checks in (201, action CHECK_IN), the second checks out (200, CHECK_OUT), a third is 409. A second scan sooner than PUNCH_MIN_GAP_SECONDS is 409 PUNCH_TOO_SOON. Errors: 401 INVALID_QR_TOKEN / QR_TOKEN_USED, 404 unknown employee, 409 terminated employee.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qrToken]
              properties:
                qrToken: { type: string }
      responses:
        '200':
          description: Punch recorded
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /attendance/adjust:
    post:
      tags: [attendance]
      summary: Correct one day (upsert)
      description: >
        Roles CEO, HR_DIRECTOR. Times are ISO 8601 with offset; the trigger recomputes late minutes, hours and status from them. A status-only day (for example NGHI_PHEP) needs no times. 201 when the day was created, 200 when updated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employeeId, workDate]
              properties:
                employeeId: { type: string }
                workDate: { type: string, format: date }
                checkIn: { type: string, format: date-time }
                checkOut: { type: string, format: date-time }
                status: { $ref: '#/components/schemas/AttendanceStatus' }
                note: { type: string }
      responses:
        '200':
          description: Updated day
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /attendance/timesheet:
    get:
      tags: [attendance]
      summary: Monthly timesheet matrix
      description: >
        One row per employee with `cells` (date -> status) and `totals` (work_days, late_days, leave_days, absent_days, ot_hours). Scoped by role.
      parameters:
        - { name: month, in: query, required: true, schema: { type: string, example: 2026-09 } }
        - { name: department, in: query, schema: { type: string } }
      responses:
        '200':
          description: "{ month, days, rows }"
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /attendance/exceptions:
    get:
      tags: [attendance]
      summary: Late and absent employees for a day
      description: >
        Roles CEO, HR_DIRECTOR, LINE_MANAGER (own department). `absent` lists active employees with no punch and no approved leave; it is empty on weekends.
      parameters:
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: "{ date, late, absent }"
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /attendance/live:
    get:
      tags: [attendance]
      summary: Today's latest punches (max 50)
      responses:
        '200':
          description: Latest events, newest first
        '403': { $ref: '#/components/responses/Error' }
  /leaves:
    post:
      tags: [leaves]
      summary: Submit a leave request
      description: >
        snake_case field names are accepted too. Refused with 409 LEAVE_OVERLAP (overlaps an active request), 409 INSUFFICIENT_BALANCE (balance minus pending requests), 400 for inactive types or invalid dates. Chain: employee -> LINE_MANAGER of the same department -> HR_DIRECTOR. Requests of a LINE_MANAGER or HR_DIRECTOR are approved only by the CEO, a CEO request is approved automatically, the CEO may approve any pending step directly, and nobody acts on their own request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leaveTypeId, startDate, endDate, reason]
              properties:
                leaveTypeId: { type: string, example: LT-AL }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
                totalDays: { type: number, multipleOf: 0.5, description: Optional; Monday-Friday days are computed when omitted }
                reason: { type: string }
                handoverTo: { type: string, nullable: true }
                attachmentUrl: { type: string, nullable: true }
                attachmentName: { type: string, nullable: true }
      responses:
        '201':
          description: Created (stage depends on the requester)
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    get:
      tags: [leaves]
      summary: List leave requests (paged)
      parameters:
        - { name: stage, in: query, schema: { type: string, enum: [CHO_TRUONG_PHONG_DUYET, CHO_HR_PHE_CHUAN, DA_PHE_DUYET, TU_CHOI, DA_HUY] } }
        - { name: month, in: query, schema: { type: string } }
        - { name: employeeId, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/limit' }
      responses:
        '200':
          description: Page of requests, scoped by role
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /leaves/calendar:
    get:
      tags: [leaves]
      summary: Leaves overlapping a month
      parameters:
        - { name: month, in: query, required: true, schema: { type: string, example: 2026-09 } }
        - { name: department, in: query, schema: { type: string } }
      responses:
        '200':
          description: Pending and approved leaves
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /leaves/types:
    get:
      tags: [leaves]
      summary: Leave types
      responses:
        '200':
          description: Leave types
  /leaves/balances/{employeeId}:
    get:
      tags: [leaves]
      summary: Leave balances for the current year
      description: >
        Use `me` for the caller. LINE_MANAGER may read their department, HR/CEO everyone.
      parameters:
        - { name: employeeId, in: path, required: true, schema: { type: string, example: me } }
      responses:
        '200':
          description: Balances
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /leaves/{id}:
    get:
      tags: [leaves]
      summary: Leave request detail
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, example: LP-2026-101 } }
      responses:
        '200':
          description: Request with approver names
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /leaves/{id}/approve:
    patch:
      tags: [leaves]
      summary: Approve the current step
      description: >
        Chain: employee -> LINE_MANAGER of the same department -> HR_DIRECTOR. Requests of a LINE_MANAGER or HR_DIRECTOR are approved only by the CEO, a CEO request is approved automatically, the CEO may approve any pending step directly, and nobody acts on their own request. Final approval fails with 409 INSUFFICIENT_BALANCE when the days no longer fit; the balance trigger charges the days.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, example: LP-2026-101 } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        '200':
          description: Updated request
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /leaves/{id}/reject:
    patch:
      tags: [leaves]
      summary: Reject the request
      description: >
        Chain: employee -> LINE_MANAGER of the same department -> HR_DIRECTOR. Requests of a LINE_MANAGER or HR_DIRECTOR are approved only by the CEO, a CEO request is approved automatically, the CEO may approve any pending step directly, and nobody acts on their own request.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, example: LP-2026-101 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, description: Required }
      responses:
        '200':
          description: Rejected request
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /leaves/{id}/cancel:
